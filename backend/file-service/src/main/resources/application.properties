spring.application.name=file-service
server.port=8084

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# S3 Configuration (Environment variables recommended in production)
aws.s3.accessKey=${AWS_ACCESS_KEY:your_access_key}
aws.s3.secretKey=${AWS_SECRET_KEY:your_secret_key}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_BUCKET:myarogya-data}

# File Upload Limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
